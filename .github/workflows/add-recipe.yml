name: add-recipe

# An issue titled "מתכון: ..." (opened from the site's add form) becomes a commit to recipes.json + index.html.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: add-recipe   # serialize so two quick adds don't race on the push
  cancel-in-progress: false

jobs:
  add:
    # Public repo: only the owner's issues may write data.
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      (startsWith(github.event.issue.title, 'מתכון') || startsWith(github.event.issue.title, 'recipe'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Parse and add
        id: add
        env:
          BODY: ${{ github.event.issue.body }}   # via env, never inlined into the script (injection)
        run: |
          if printf '%s' "$BODY" | python add_recipe.py - > out.txt 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          cat out.txt
      - name: Commit
        if: steps.add.outputs.ok == 'true'
        env:
          N: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recipes.json index.html
          git commit -m "מתכון חדש (#$N)" || exit 0
          git pull --rebase -q && git push
      - name: Reply on the issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number }}
          OK: ${{ steps.add.outputs.ok }}
        run: |
          if [ "$OK" = "true" ]; then
            gh issue close "$N" --repo "$GITHUB_REPOSITORY" --comment "$(cat out.txt)"
          else
            gh issue comment "$N" --repo "$GITHUB_REPOSITORY" --body-file out.txt
          fi
